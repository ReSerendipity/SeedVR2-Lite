name: Desktop Installer (Windows)

# 单文件安装包产线：Tauri 壳 + 瘦包数据卷 → NSIS 单文件安装器 → 挂到对应 tag 的 Release。
#
# 背景：docs/发布与分发-单文件安装包.md（2026-10-31 定案）规定只发布
# SeedVR2-Setup-v<版本>.exe（数据卷内嵌、运行时装后由应用内下载管理获取），
# 但 v1.8.0 Release 没有任何资产、安装器只存在于本地 scripts/installer。
# 这条 workflow 把「壳编译 → 瘦包数据卷 → makensis → 上传」接到 windows runner。
#
# 注意：不下载/不捆绑 app/ffmpeg.exe、ffprobe.exe —— NOTICE 第 4 条明确
# 「仅作为本地开发运行依赖，未随 GitHub 仓库或便携包分发」，随包分发需先解决
# GPL 源码提供义务。视频能力由用户自装 FFmpeg（置于 PATH）。
#
# 触发：
#   - workflow_dispatch：输入 tag，对既有 Release 补挂安装器（同名资产跳过）。
#   - push tag v*：新版本自动出包；Release 不存在时只留 workflow artifact。
#
# 产物：SeedVR2-Setup-v<ver>.exe + .exe.sha256（不含 torch 与模型权重）

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '目标 Release tag（如 v1.8.0）；留空则使用触发 ref'
        required: false
        type: string
      dry_run:
        description: '只构建，不上传 Release'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: desktop-installer-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  installer:
    name: Build NSIS installer (windows)
    runs-on: windows-latest
    timeout-minutes: 90

    env:
      PRODUCT: SeedVR2
      CARGO_BIN: seedvr2-desktop
      PYTHONUTF8: '1'

    steps:
      - name: Resolve target tag
        id: target
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "${{ github.ref_name }}" }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "非法 tag：$tag（要求 vX.Y.Z）" }
          $ver = $tag.Substring(1)
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "tag=$tag" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version=$ver" -Encoding utf8
          Write-Host "target=$tag version=$ver"

      - name: Checkout tag source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      # v1.8.0 的 tag 内 bundler 用 `Winpython64.exe /S /D=` 解压 WinPython；该安装器是 7z SFX，
      # /S 不是静默参数，CI 会挂在「解压 WinPython ...」直到 job 超时。修复在 main 上，
      # 仅当 tag 版本缺少修复标记时才覆盖 bundler（后续 tag 自带修复则此步为 no-op）。
      - name: Ensure bundler extracts WinPython with 7-Zip
        shell: pwsh
        run: |
          $marker = 'x $installer "-o$prep"'
          if (-not (Select-String -LiteralPath scripts/build_desktop_bundle.ps1 -SimpleMatch $marker -Quiet)) {
            Write-Host 'tag 内 bundler 仍是 /S 解压，从 main 取修复后的脚本'
            Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/ReSerendipity/SeedVR2-Lite/main/scripts/build_desktop_bundle.ps1' -OutFile scripts/build_desktop_bundle.ps1
            if (-not (Select-String -LiteralPath scripts/build_desktop_bundle.ps1 -SimpleMatch $marker -Quiet)) {
              throw 'bundler overlay 失败：修复标记仍缺失'
            }
          }

      - name: Version consistency (tag == version.json)
        shell: pwsh
        run: |
          $ver = "${{ steps.target.outputs.version }}"
          $vj = Get-Content -LiteralPath version.json -Raw -Encoding utf8 | ConvertFrom-Json
          if ($vj.version -ne $ver) { throw "version.json=$($vj.version) 与 tag v$ver 不一致" }
          Write-Host "version.json OK: $($vj.version)"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Build Tauri shell (release)
        working-directory: desktop/src-tauri
        run: cargo build --release --locked

      - name: Stage shell exe into installer dir
        shell: pwsh
        run: |
          $src = "desktop/src-tauri/target/release/$env:CARGO_BIN.exe"
          if (-not (Test-Path -LiteralPath $src)) { throw "未找到壳 exe：$src" }
          New-Item -ItemType Directory -Path scripts/installer -Force | Out-Null
          Copy-Item -LiteralPath $src -Destination "scripts/installer/$env:PRODUCT.exe" -Force
          Get-Item -LiteralPath "scripts/installer/$env:PRODUCT.exe" | Select-Object Name, Length | Format-Table

      - name: Install NSIS and prepare standalone 7za
        shell: pwsh
        run: |
          choco install nsis --no-progress -y | Out-Host
          $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          if (-not (Test-Path -LiteralPath $sevenZip)) {
            choco install 7zip --no-progress -y | Out-Host
          }
          if (-not (Test-Path -LiteralPath $sevenZip)) { throw '7-Zip 不可用' }

          # 安装器内嵌的是独立版 7za.exe（7z.exe 依赖 7z.dll，不能单独分发）
          $work = Join-Path $env:RUNNER_TEMP '7za-extra'
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          $pkg = Join-Path $work '7z-extra.7z'
          Invoke-WebRequest -Uri 'https://www.7-zip.org/a/7z2501-extra.7z' -OutFile $pkg
          & $sevenZip x $pkg "-o$work" -y -bso0 -bsp0
          if ($LASTEXITCODE -ne 0) { throw "解压 7-Zip Extra 失败：$LASTEXITCODE" }
          $sevenZa = Join-Path $work '7za.exe'
          if (-not (Test-Path -LiteralPath $sevenZa)) { throw '7-Zip Extra 内未找到 7za.exe' }
          New-Item -ItemType Directory -Path dist/tools -Force | Out-Null
          Copy-Item -LiteralPath $sevenZa -Destination dist/tools/7za.exe -Force

      - name: Build slim data volume
        shell: pwsh
        run: |
          # OutDir 必须是绝对路径：脚本内用 Split-Path -Qualifier 比较盘符，相对路径会直接抛
          # "Cannot parse path because path ... does not have a qualifier specified."
          $out = Join-Path $env:GITHUB_WORKSPACE 'dist/desktop-release'
          & ./scripts/build_desktop_bundle.ps1 -OutDir $out
          if ($LASTEXITCODE -ne 0) { throw "数据卷构建失败：$LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath "$out/SeedVR2-Data.7z.001")) {
            throw "数据卷缺失：$out/SeedVR2-Data.7z.001"
          }

      - name: Compile single-file installer
        shell: pwsh
        working-directory: scripts/installer
        run: |
          $ver = "${{ steps.target.outputs.version }}"
          $data = (Resolve-Path -LiteralPath '..\..\dist\desktop-release\SeedVR2-Data.7z.001').Path
          $sevenZa = (Resolve-Path -LiteralPath '..\..\dist\tools\7za.exe').Path
          $nsis = @(
            (Join-Path $env:ProgramFiles 'NSIS\makensis.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe')
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $nsis) { throw 'makensis 未找到（NSIS 安装失败？）' }
          $env:SOURCE_DATE_EPOCH = (git -C (Resolve-Path '..\..').Path log -1 --format=%ct)
          & $nsis "/DAPP_VERSION=$ver" "/DSRC_DATA=$data" "/DSRC_7ZA=$sevenZa" 'setup.nsi'
          if ($LASTEXITCODE -ne 0) { throw "makensis 失败：$LASTEXITCODE" }
          $out = "SeedVR2-Setup-v$ver.exe"
          if (-not (Test-Path -LiteralPath $out)) { throw "未见安装器产物：$out" }
          Get-Item -LiteralPath $out | Select-Object Name, Length | Format-Table

      - name: Checksum
        shell: pwsh
        run: |
          $ver = "${{ steps.target.outputs.version }}"
          $out = 'dist/installer-out'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $exe = Join-Path $out "SeedVR2-Setup-v$ver.exe"
          Copy-Item -LiteralPath "scripts/installer/SeedVR2-Setup-v$ver.exe" -Destination $exe -Force
          $sha = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$exe.sha256", "$sha  $([IO.Path]::GetFileName($exe))`n", (New-Object System.Text.UTF8Encoding($false)))
          Get-ChildItem -LiteralPath $out | Select-Object Name, Length | Format-Table

      - name: Upload to Release
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.target.outputs.tag }}"
          $ver = "${{ steps.target.outputs.version }}"
          $out = 'dist/installer-out'
          $assets = @(
            "SeedVR2-Setup-v$ver.exe",
            "SeedVR2-Setup-v$ver.exe.sha256"
          )

          $existing = gh release view $tag --json assets --jq '.assets[].name' 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Release $tag 不存在，安装器仅保留在 workflow artifact"
            exit 0
          }
          foreach ($asset in $assets) {
            if ($existing -contains $asset) { Write-Host "skip existing asset: $asset"; continue }
            gh release upload $tag (Join-Path $out $asset)
            if ($LASTEXITCODE -ne 0) { throw "上传失败：$asset" }
          }
          Write-Host '--- release assets ---'
          gh release view $tag --json assets --jq '.assets[] | "\(.name)  \(.size) bytes"'
          Write-Host "https://github.com/${{ github.repository }}/releases/tag/$tag"

      - name: Upload workflow artifact (fallback)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: SeedVR2-Setup-installer
          path: |
            dist/installer-out/*
          if-no-files-found: warn
          retention-days: 14
