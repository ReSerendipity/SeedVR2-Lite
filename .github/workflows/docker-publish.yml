# 镜像构建发布流水线（对应云原生评估报告 P1-4：补齐 12-Factor V 因素）
#
# 镜像扫描（云原生评估 P1-2）：push main/tags 后由独立 scan job 对已推送镜像
# 按 digest 运行 Trivy（CRITICAL/HIGH、ignore-unfixed），**报告不阻断**——
# CUDA 用户态轮子存量 CVE 较多，先建立可见性，再按趋势收紧 exit-code 门禁。
#
# 触发：
#   - push tag v*      → 发布版本化镜像（semver / major.minor / commit-sha）
#   - push main        → 发布开发镜像（branch 名 + commit-sha）
#   - PR               → 仅构建验证，不推送
#
# 版本化纪律：不使用 floating `latest` tag（评估报告反模式 #3）。
# 基础镜像 tag 在 Dockerfile 内锁定；发布前可用
#   docker manifest inspect -v python:3.12-slim-bookworm
# 核对 digest 后改写 FROM 行。
name: docker-publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # metadata-action 会自动将镜像名小写化，满足 ghcr.io 命名要求
  IMAGE_NAME: ${{ github.repository }}

# 同 PR 的新推送会取代旧运行的结论：取消旧运行，只留最新一次。
# push（含 main 上的正式验证）不取消——那条是权威记录，不能被后来的推送半路掐掉。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  build-push:
    name: Build & push container image
    runs-on: ubuntu-latest
    outputs:
      # 供 scan job 按不可变 digest 扫描（避免 tag 在两次 job 间被覆盖的竞态）
      # digest 来自 build-push-action（steps.build）；metadata-action（steps.meta）
      # 只有 tags/labels/version 输出——引用它会使 digest 为空、Trivy 的
      # image-ref 以 "@ " 结尾无法解析（2026-09-06 CI 实测 FATAL）。
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # PR 只做构建验证，不登录不推送
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags / labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # v1.5.0 → 1.5.0 / 1.5 / 1（版本化 tag，禁止 latest）
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # main 分支开发镜像
            type=ref,event=branch
            # 每次构建的不可变 sha tag
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=SeedVR2

      - name: Build (and push on main/tags)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          # GPU 推理目标平台：CUDA 用户态库与 NVIDIA 驱动仅提供 amd64 变体
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          # gha 缓存：依赖层（torch 等）变更频率低，命中率高
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Output image digest
        if: github.event_name != 'pull_request'
        run: |
          echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> "$GITHUB_STEP_SUMMARY"
          echo "digest=${{ steps.meta.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"

  scan:
    name: Scan image (Trivy, report-only)
    needs: build-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # 拉取本仓库 GHCR 包（含私有可见性场景）
    steps:
      - name: Lowercase image ref (OCI 命名强制小写；metadata-action 只小写化构建 tags，
          Trivy 的 image-ref 自行拼接须同样处理，大写名 FATAL "could not parse reference")
        id: img
        run: echo "ref=ghcr.io/${REPO,,}@${DIGEST}" >> "$GITHUB_OUTPUT"
        env:
          REPO: ${{ github.repository }}
          DIGEST: ${{ needs.build-push.outputs.digest }}

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy vulnerability scan (report-only, no gate)
        # tag 必须带 v 前缀（aquasecurity/trivy-action 的发布 tag 均为 v0.x.y，
        # 2026-09-06 实测：`0.28.0` 无此 tag，action 解析失败打红整条 workflow）。
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.img.outputs.ref }}
          format: table
          # 报告不阻断（评估报告 P1-2 建议：先可见性，后收紧）。收紧时改 '1'
          # 并按需配 .trivyignore（列出已确认不受影响的 CVE 与豁免理由）。
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Scan summary
        run: |
          echo "### Trivy 扫描（报告模式）" >> "$GITHUB_STEP_SUMMARY"
          echo "image: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-push.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "severity=CRITICAL,HIGH, ignore-unfixed=true, exit-code=0（不阻断）" >> "$GITHUB_STEP_SUMMARY"
