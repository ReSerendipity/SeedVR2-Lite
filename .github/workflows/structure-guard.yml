name: structure-guard

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同 PR 的新推送会取代旧运行的结论：取消旧运行，只留最新一次。
# push（含 main 上的正式验证）不取消——那条是权威记录，不能被后来的推送半路掐掉。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Check repository root layout
        run: python .github/scripts/check_layout.py
      - name: Check spec references (if present)
        run: |
          if [ -f scripts/check_spec_refs.py ]; then
            python scripts/check_spec_refs.py
          else
            echo "scripts/check_spec_refs.py not present; skipping"
          fi
      - name: Check reference availability (no phantom refs to undistributed local files)
        run: python scripts/check_local_only_refs.py --all
