name: Dependency Audit

on:
  pull_request:
    paths:
      - 'requirements.txt'
      - 'requirements-lock.txt'
      - 'pyproject.toml'
      - 'tests/package.json'
      - 'tests/package-lock.json'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# 同 PR 的新推送会取代旧运行的结论：取消旧运行，只留最新一次。
# push（含 main 上的正式验证）不取消——那条是权威记录，不能被后来的推送半路掐掉。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  audit:
    # 必须与锁的平台一致：requirements-lock.txt 的 --hash 是 Windows 轮实测值，
    # ubuntu 解析 manylinux 轮必报 hash mismatch（pip-audit -r 模式必定走 pip
    # 下载校验，--no-deps 只跳过传递依赖解析，2026-08-30 两轮实测）
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # 依赖清单头部中文注释为 UTF-8：Windows runner 缺省 cp1252 会让
      # pip_requirements_parser / safety 的文件读取解码崩溃（0x9d/0x81），
      # job 级强制 UTF-8（5a9594e 只修了 pip-audit 步骤，safety 步骤复发实锤）
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          # pip-audit -r 模式会以 pip --dry-run 下载各钉版轮子校验哈希（torch cu132
          # Windows 轮 ~2.5GB），按锁文件内容缓存下载产物，冷跑一次后免重复下载
          cache: 'pip'
          cache-dependency-path: 'requirements-lock.txt'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit on requirements
        env:
          # requirements-lock.txt 里 torch/torchvision 是 +cu132 本地版本号，仅存在于
          # PyTorch 源；不注入 extra index 时 pip 在 PyPI 找不到分发，触及依赖清单的
          # PR 与每周定时审计必红（pip-audit 需真实安装被审环境）
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cu132
        run: |
          if [ -f requirements-lock.txt ]; then
            # --no-deps：锁文件已全量钉版（含传递依赖），跳过依赖解析；
            # 注意它并不能跳过哈希校验——pip 仍会逐包下载校验 --hash，
            # 因此本 job 必须跑在与锁一致的 windows 平台（2026-08-30 ubuntu 实测必红）
            pip-audit -r requirements-lock.txt --no-deps || exit 1
          elif [ -f requirements.txt ]; then
            pip-audit -r requirements.txt || exit 1
          else
            echo "No requirements file found, skipping audit"
          fi

      - name: Install safety
        run: pip install safety

      - name: Run safety check
        run: |
          if [ -f requirements.txt ]; then
            safety check -r requirements.txt --json
          fi

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Run npm audit
        run: |
          cd tests
          npm audit --audit-level=moderate || exit 1
