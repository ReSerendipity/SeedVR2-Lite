# .github/workflows/portable-release.yml
# Portable offline multi-volume release bundles: 4 components -> volumes, every file < 2 GiB,
# uploaded to GitHub Release.
#
# Two trigger paths, deliberately split (2026-09-10):
#   - `push: tags: ["v*"]` -> BUILD ONLY: builds the bundles, runs the unpack + smoke
#     gates, and keeps them as a workflow artifact (5 days). It never touches a GitHub
#     Release. Rationale: the incremental-update release (app-v<ver>.zip) is published by
#     hand for the same tag, and the previous unconditional `gh release edit` + volume
#     upload overwrote its notes and appended ~5.6 GB of portable volumes (GOTCHAS #113).
#   - `workflow_dispatch` with `upload_to_release: true` -> PUBLISH: the only path that
#     creates/edits the Release, uploads the volumes, and GPG-signs SHA256SUMS.txt.
#
# The old Inno Setup exe route (desktop-release.yml) was removed on 2026-08-28 once
# this path proved out in CI. Rationale: docs/project/PORTABLE_BUNDLES.md (local-only doc).
#
# Components and volume count (sizes are reference estimates; the authoritative total is
# the `total_gb` output of the size-gate step at build time. core grew ~8x in v1.5.1
# because all non-torch deps are now preinstalled into the WinPython interpreter, and
# its headroom to the 1900 MB slice cap within a single volume is only ~100 MB —
# re-check the volume count whenever core payload grows further):
#   core          app code + WinPython portable interpreter (all non-torch deps preinstalled)  1 vol  ~1.9 GB  (v1.5.1 local 7z-store measure; zip deflate is smaller)
#   torch         PyTorch cu132 wheels incl. transitive deps (installed offline)              2 vol  ~2.8 GB
#   model-shared  ema_vae_fp16 + pos_emb + neg_emb                                            1 vol  ~0.45 GB
#   model-fp8     seedvr2_3b_mxfp8 (the one bundled main model, MXFP8)                        2 vol  ~2.2 GB  (zip deflate)
#
# IMPORTANT - keep every `run:` block ASCII-only. GitHub writes the step body to a temp .ps1
# without a BOM and runs it under Windows PowerShell 5.1, which decodes BOM-less files using the
# ANSI codepage: non-ASCII literals come out mojibake and can even break parsing. Step `name:`
# values are safe (the YAML itself is parsed as UTF-8).
name: Portable Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（留空则依次取 tag / pyproject.toml）"
        required: false
        default: ""
      components:
        description: "要构建的组件，逗号分隔"
        required: false
        default: "core,torch,model-shared,model-fp8"
      upload_to_release:
        description: "是否上传到 GitHub Release（仅 workflow_dispatch 生效；tag 推送恒不上传，只留 workflow artifact）"
        type: boolean
        required: false
        default: false
      require_gpu_inference:
        description: "冒烟是否强制跑完一次真实推理（需 self-hosted GPU runner；托管 runner 无 GPU）"
        type: boolean
        required: false
        default: false
  # Tag push = build + smoke gate + artifact only. It never publishes a Release.
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: portable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-bundles:
    runs-on: windows-latest
    timeout-minutes: 120
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    env:
      BUNDLE_DIR: ${{ github.workspace }}\dist\bundles
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"
      # Optional Authenticode signing (P3): set WINDOWS_PFX_BASE64 / WINDOWS_PFX_PASSWORD
      # repo secrets to Authenticode-sign the shipped .ps1 helpers; absent secrets => the
      # build produces unsigned scripts exactly as before.
      SIGN_PFX_B64: ${{ secrets.WINDOWS_PFX_BASE64 }}
      SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
      # D/P2-3: integrity manifest Ed25519 signing private key (base64 PEM).
      # Set repo secret MANIFEST_SIGNING_KEY_B64 once from a local
      # `scripts/generate_manifest_signing_key.py` run. Absent => first run
      # generates a fresh keypair (identity drift across releases - see the
      # prepare step warning).
      MANIFEST_SIGNING_KEY_B64: ${{ secrets.MANIFEST_SIGNING_KEY_B64 }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: 解析版本号
        id: ver
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          $inputVer = "${{ github.event.inputs.version }}"
          if ($ref -match '^v(.+)$') {
            $v = $Matches[1]
          } elseif ($inputVer) {
            $v = $inputVer
          } else {
            $v = (& python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          }
          if (-not $v) { throw "cannot resolve version" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append
          "tag=v$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append
          Write-Host "bundle version: $v"

      - name: 安装下载依赖
        shell: pwsh
        run: python -m pip install --upgrade pip setuptools huggingface_hub requests rich pyyaml cryptography cython

      - name: 从 config.yaml 取所需权重文件名
        id: files
        shell: pwsh
        run: |
          # Single source of truth for weight filenames: the build script reads config.yaml.
          $names = & .\scripts\build_portable_bundle.ps1 -PrintModelFiles
          if ($LASTEXITCODE -ne 0) { throw "-PrintModelFiles failed" }
          $names = @($names | Where-Object { $_ })
          if ($names.Count -lt 1) { throw "no weight filenames resolved" }
          Write-Host "required weights: $($names -join ', ')"
          "names=$($names -join ' ')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append

      - name: Restore model weight cache (cost P1-3)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Cache the downloaded safetensors so repeated release builds skip the
          # ~3.6 GB re-download from HF. download_model.py is idempotent (skips
          # existing non-empty files) and now also verifies sha256 against
          # config.yaml, so a corrupted/stale cache fails loudly instead of
          # producing a bad bundle.
          path: model
          key: model-weights-${{ steps.files.outputs.names }}-${{ hashFiles('config.yaml') }}
          restore-keys: |
            model-weights-${{ steps.files.outputs.names }}-

      - name: 下载便携包模型权重
        shell: pwsh
        run: |
          # 只从 HF 下 safetensors（3b FP8 主权重 + VAE）。pos_emb/neg_emb 是仓库内嵌资产
          # （scripts/bundle_assets/），由 build_portable_bundle.ps1 直接打包，不在此联网拉取
          # （HF 社区仓库 numz/SeedVR2_comfyUI 缺失这两个 .pt，返回 404）。
          $names = "${{ steps.files.outputs.names }}".Split(' ') | Where-Object { $_ -match '\.safetensors$' }
          if ($names.Count -lt 1) { throw "no safetensors to download from HF" }
          $argv = @("scripts/download_model.py", "--files") + $names
          & python $argv
          if ($LASTEXITCODE -ne 0) { throw "model weight download failed" }
          Get-ChildItem model | Select-Object Name, @{n='GB';e={[math]::Round($_.Length/1GB,3)}} | Format-Table -AutoSize

      - name: Prepare manifest signing key (D/P2-3)
        shell: pwsh
        run: |
          $keyFile = Join-Path (Get-Location) 'data\.manifest_signing_key'
          if ($env:MANIFEST_SIGNING_KEY_B64) {
            # CI Secret injection: decode base64 PEM to data/.manifest_signing_key.
            # The build script signs integrity_manifest.json with this private key;
            # the public key ships inside the bundle for user-side verification.
            New-Item -ItemType Directory -Path (Split-Path $keyFile) -Force | Out-Null
            [IO.File]::WriteAllBytes($keyFile, [Convert]::FromBase64String($env:MANIFEST_SIGNING_KEY_B64))
            Write-Host "Manifest signing key injected from CI secret"
          } else {
            # First run: generate a fresh keypair so the bundle is signed at all.
            & python scripts\generate_manifest_signing_key.py
            if ($LASTEXITCODE -ne 0) { throw "generate manifest signing key failed" }
            $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($keyFile))
            Write-Host "::warning::No MANIFEST_SIGNING_KEY_B64 secret set. Generated a fresh keypair this run; set the repo secret to keep verification identity stable across releases (base64 below)."
            Write-Host $b64
          }

      - name: Build closed components (A-line, Cython .pyd)
        shell: pwsh
        run: |
          # A 线闭源注入：security/ 编译为 .pyd 并打包 closed.zip，构建时替换源码。
          # 缺失此步会让 Release 包保持源码态（水印 .py 明文），违背发布门禁
          # （GOTCHAS #97，2026-09-09：portable-release.yml 曾漏传 -ClosedComponentsZip）。
          python scripts\build_closed_components.py --out $env:RUNNER_TEMP\closed-out --zip $env:RUNNER_TEMP\closed.zip
          if ($LASTEXITCODE -ne 0) { throw "closed components build failed" }
          Get-Item $env:RUNNER_TEMP\closed.zip | Select-Object Name, Length

      - name: 构建分卷包
        shell: pwsh
        run: |
          $comp = "${{ github.event.inputs.components }}"
          if (-not $comp) { $comp = "core,torch,model-shared,model-fp8" }
          $list = @($comp.Split(',') | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          Write-Host "building components: $($list -join ', ')"
          $signArgs = @()
          if ($env:SIGN_PFX_B64) {
            # Authenticode sign INSIDE the build script (before SHA256SUMS.txt is written)
            # so the manifest hashes match the signed bytes.
            $pfx = Join-Path $env:RUNNER_TEMP 'release-sign.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_B64))
            $signArgs = @('-SigningPfxPath', $pfx, '-SigningPfxPassword', $env:SIGN_PFX_PASSWORD)
            Write-Host "Authenticode signing enabled (WINDOWS_PFX_BASE64 present)"
          }
          # -Format zip so end users can extract with built-in tar.exe / Explorer (no 7-Zip needed).
          & .\scripts\build_portable_bundle.ps1 `
            -Version "${{ steps.ver.outputs.version }}" `
            -Component $list `
            -ClosedComponentsZip $env:RUNNER_TEMP\closed.zip `
            -OutDir $env:BUNDLE_DIR `
            -Format zip `
            @signArgs
          if ($LASTEXITCODE -ne 0) { throw "bundle build failed" }
          Get-ChildItem $env:BUNDLE_DIR -File |
            Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} | Format-Table -AutoSize

      - name: 体积门禁复核
        id: gate
        shell: pwsh
        run: |
          $limit = 2147483648
          $all = @(Get-ChildItem $env:BUNDLE_DIR -File | Where-Object { $_.Name -ne 'upload-list.txt' })
          foreach ($f in $all) { Write-Host ("{0,10:N1} MB  {1}" -f ($f.Length/1MB), $f.Name) }
          $bad = @($all | Where-Object { $_.Length -gt $limit })
          if ($bad.Count -gt 0) {
            foreach ($f in $bad) { Write-Host "::error::oversize asset, refusing to upload: $($f.Name)" }
            throw "one or more artifacts exceed the GitHub 2 GiB per-file limit"
          }
          $total = ($all | Measure-Object Length -Sum).Sum
          Write-Host "artifacts total: $([math]::Round($total/1GB,2)) GB"
          "total_gb=$([math]::Round($total/1GB,2))" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append

      - name: 解包冒烟验收（发布前门禁）
        shell: pwsh
        run: |
          # Real unpacker run against the freshly produced volumes: per-part SHA256 -> merge ->
          # extract -> offline torch install -> manifest cross-check. Equivalent to a user's first install.
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'portable-smoke'
          & .\scripts\unpack_portable_bundle.ps1 -BundleDir $env:BUNDLE_DIR -TargetDir $smokeRoot
          if ($LASTEXITCODE -ne 0) { throw "unpack failed, refusing to publish" }
          $appDir = Join-Path $smokeRoot 'SeedVR2-Portable'
          if (-not (Test-Path $appDir)) { throw "unpack did not produce $appDir" }

          # Integrity gate (2026-09-10, GOTCHAS #114): the release config.yaml ships with
          # integrity_enforce=true, so a manifest that drifted from the shipped bytes makes the
          # user-side startup self-check REFUSE TO BOOT. Verify the unpacked payload against its own
          # manifest + Ed25519 signature before spending 30 min on the smoke run.
          & python .\scripts\verify_release_integrity.py --app-root $appDir --require-enforce
          if ($LASTEXITCODE -ne 0) { throw "integrity gate failed on unpacked payload: $appDir" }

          # Smoke: start portable server -> health -> CSRF double-submit -> restore task -> verify output.
          # Hosted windows runners have no GPU, so real inference is not required here; but any packaging
          # level error (server won't boot, 404 route, 403 CSRF, import failure, corrupt output) fails hard.
          # On a self-hosted GPU runner, set require_gpu_inference=true to force a real restore.
          $extra = @()
          if ('${{ github.event.inputs.require_gpu_inference }}' -eq 'true') { $extra += '--require-inference' }

          # 冒烟前诊断（GOTCHAS #98）：用便携 python + payload 闭源 pyd 直接验签，
          # 与服务器启动自检同一函数，True/False 直接区分「pyd/环境问题」与「启动路径问题」。
          $portablePy = Get-ChildItem -Path $appDir -Recurse -Filter python.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'WPy' } | Select-Object -First 1
          if ($portablePy) {
              $diag = & $portablePy.FullName .\scripts\diag_portable_verify.py --app-dir $appDir 2>&1
              $diag | ForEach-Object { Write-Host "  [诊断] $_" }
          } else {
              Write-Host "  [诊断] 未找到便携 python"
          }

          & python .\scripts\smoke_portable_bundle.py --app-dir $appDir --boot-timeout 900 --submit-timeout 900 --task-timeout 1800 --resolution 512 --keep-log @extra
          if ($LASTEXITCODE -ne 0) {
              $smokeLog = Join-Path $appDir 'logs\smoke_portable.log'
              if (Test-Path $smokeLog) {
                  Write-Host "  | ---- smoke_portable.log tail ----"
                  Get-Content $smokeLog -Tail 30 -Encoding UTF8 | ForEach-Object { Write-Host "  | $_" }
              }
              throw "post-unpack smoke gate failed, refusing to publish"
          }
          $log = Join-Path $appDir 'logs\smoke_portable.log'
          if (Test-Path $log) { Get-Content $log -Tail 20 -Encoding UTF8 | ForEach-Object { Write-Host "  | $_" } }

      - name: Generate build provenance attestation (SLSA)
        if: github.event_name == 'push' || inputs.upload_to_release
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/bundles/**

      - name: 保留为 workflow artifact（tag 推送，或 dispatch 未发布会话）
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.upload_to_release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SeedVR2-Portable-${{ steps.ver.outputs.version }}-win-x64
          path: dist/bundles/**
          retention-days: 5
          if-no-files-found: error

      - name: 创建或确认 Release（仅手动 dispatch 发布会话）
        if: github.event_name == 'workflow_dispatch' && inputs.upload_to_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          # ASCII-only title: PS 5.1 decodes this BOM-less step script with the ANSI codepage.
          gh release create $tag --title "SeedVR2 $tag (portable offline bundles)" --target ${{ github.sha }} 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Host "release $tag may already exist, continuing" }
          # -Encoding UTF8 is required: the template holds Chinese and has no BOM.
          $notes = Get-Content -Raw -Encoding UTF8 launcher\release-notes-portable.md
          if (-not $notes) { throw "cannot read launcher/release-notes-portable.md, release body would be empty" }
          $notes = $notes.Replace('{{VERSION}}', "${{ steps.ver.outputs.version }}")
          $notes = $notes.Replace('{{TOTAL_GB}}', "${{ steps.gate.outputs.total_gb }}")
          $bodyFile = Join-Path $env:RUNNER_TEMP "portable-release-body.md"
          [System.IO.File]::WriteAllText($bodyFile, $notes, (New-Object System.Text.UTF8Encoding($false)))
          gh release edit $tag --notes-file $bodyFile

      - name: 上传全部分卷与校验文件（仅手动 dispatch 发布会话）
        if: github.event_name == 'workflow_dispatch' && inputs.upload_to_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $skip = @('upload-list.txt')
          $files = @(Get-ChildItem $env:BUNDLE_DIR -File | Where-Object { $skip -notcontains $_.Name })
          if ($files.Count -eq 0) { throw "no artifacts to upload" }
          # Immutability policy: published release assets are NEVER overwritten (--clobber
          # removed). Re-running after a partial upload resumes by skipping assets that are
          # already present. To replace an asset, delete it in the Release UI first.
          $existing = @()
          $view = gh release view $tag --json assets -q '.assets[].name' 2>$null
          if ($LASTEXITCODE -eq 0 -and $view) { $existing = @($view) }
          foreach ($f in $files) {
            if ($existing -contains $f.Name) {
              Write-Host "skip (immutable, already present): $($f.Name)"
              continue
            }
            Write-Host "uploading $($f.Name) ($([math]::Round($f.Length/1MB,1)) MB)"
            gh release upload $tag $f.FullName
            if ($LASTEXITCODE -ne 0) { throw "upload failed: $($f.Name)" }
          }
          gh release view $tag --json assets -q '.assets[].name'

  sign-release:
    name: GPG-sign SHA256SUMS
    needs: build-bundles
    if: github.event_name == 'workflow_dispatch' && inputs.upload_to_release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      # 本 job 无 checkout，gh CLI 需显式仓库上下文（否则 "failed to run git: not a git repository"）
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Skip when GPG secrets are not configured
        if: env.GPG_PRIVATE_KEY == ''
        run: >
          echo "::notice::GPG secrets are not configured - SHA256SUMS.txt stays unsigned;"
          "configure GPG_PRIVATE_KEY / GPG_PASSPHRASE / GPG_KEY_ID or run gpg-signed-release.yml manually."
      - name: Import key, sign and upload SHA256SUMS.gpg
        if: env.GPG_PRIVATE_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          set -euo pipefail
          TAG="${{ needs.build-bundles.outputs.tag }}"
          rm -rf sign-work && mkdir sign-work && cd sign-work
          gh release download "$TAG" --pattern 'SHA256SUMS.txt'
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEYID_ARGS=()
          if [ -n "$GPG_KEY_ID" ]; then KEYID_ARGS=(--local-user "$GPG_KEY_ID"); fi
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 "${KEYID_ARGS[@]}" \
            --output SHA256SUMS.gpg --detach-sign SHA256SUMS.txt <<< "$GPG_PASSPHRASE"
          gpg --verify SHA256SUMS.gpg SHA256SUMS.txt
          # .gpg is a derived artifact of the immutable SHA256SUMS.txt: same input always
          # produces the same signature bytes, so clobbering on re-run is safe.
          gh release upload "$TAG" SHA256SUMS.gpg --clobber
          echo "SHA256SUMS.gpg uploaded for $TAG"

  # 便携链路端到端自测（评估报告 P2-6）：小夹具 + 1MB 切片上限，等价复现真实构建的
  # 多卷路径（切片/合并可逆、逐卷与逐归档 SHA256、体积门禁、合规剥离、缺卷/篡改拒绝、
  # manifest 组件版本字段、-ExistingInstall 增量复用），无外部依赖、不联网。
  # 与 build-bundles 并行（无 needs），不占发布关键路径；每次 tag/dispatch 都被验证。
  selftest:
    name: Portable chain self-test
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run portable bundle self-test (fixtures, offline)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\test_portable_bundle.ps1
          if ($LASTEXITCODE -ne 0) { throw "portable bundle self-test failed" }
