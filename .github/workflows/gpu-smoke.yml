# .github/workflows/gpu-smoke.yml
# 手动触发的 REAL-INFERENCE 冒烟（self-hosted GPU runner，标签 `gpu`）。
#
# 2026-11-17 维护决策：不再常驻/维护 GPU 机器 runner，因此——
#   1. 删除 schedule（原周一/周四 15:00 UTC）与 workflow_run（Portable Release 成功后联动），
#      仓库不再自动触发真机冒烟；
#   2. 删除 skip-record issue 的建/追加/自动关闭链路：runner 不在线时直接 fail（::error::），
#      不再产生自动 issue 噪声；
#   3. 仅保留 workflow_dispatch：确需真机验收时，先确保 gpu runner 在线，再手动触发。
#   恢复自动触发时：加回 schedule/workflow_run，并先把 runner 服务化（R3）保证常在线。
#
# 保留价值：托管 runner 无 GPU，portable-release 只能证明「打包正确」。本工作流下载已发布
# Release、按用户等价解包，强制一次真实推理（--require-inference），补上「模型是否真能修图」
# 的硬件盲区。
#
# 双层烟测（报告长期⑨「main 源码级 + 发布包级」的落地形态）：每次手动触发跑两遍真机——
#   第一遍发布包原样（发布可交付性），第二遍把解包目录 app/+config.yaml 换成当前分支源码、
#   复用同一便携 Python 与权重（main 引擎/显存回归）。
# 发布前的真机质量阈值阻断仍由 portable-release.yml 在 require_gpu_inference=true 时以
#   --quality-gate --min-psnr 15 --min-ssim 0.5 承担（评估 A3 整改 2026-11-05）；
#   运行时亮度劣化由 app 内 quality_breaker 熔断兜底，见 docs/ML_OPS_GATES.md §4。
#
# Runner prerequisites (one-time, on the GPU machine):
#   1. Register a self-hosted runner with the extra label `gpu`
#      (Settings -> Actions -> Runners -> New self-hosted runner -> --labels gpu)
#   2. gh CLI on PATH (release asset download)
#   3. Python 3.11+ on PATH (the smoke script is stdlib-only)
#   4. NVIDIA driver ready; ~7 GB free disk for download + unpack
#      (勾选 quant_baseline 时另需 ~8 GB：补下 3B FP8 权重 + 网络可达 hf-mirror/ModelScope)
# 无在线 `gpu` runner 时，手动触发会直接失败（不再建 skip-record issue）。
name: GPU Smoke (real inference, self-hosted)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to smoke (empty = newest published release)"
        required: false
        default: ""
      quant_baseline:
        description: "额外跑跨精度量化质量基线（MLOps P2-6，追加 fp8 权重下载 + 常驻服务真机对比，耗时显著）"
        type: boolean
        required: false
        default: false

# 同一时刻只允许一个冒烟排队（self-hosted 单 runner 天然串行；排队而非取消——
# 真机验证不可丢弃，与 portable-release 的 cancel-in-progress: false 同口径）。
concurrency:
  group: gpu-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  runner-precheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - name: Check for an online self-hosted GPU runner
        id: check
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::REPO_ADMIN_TOKEN secret 未配置，无法查询 runner 状态；冒烟未执行。本仓库已停用自动触发与 skip-record issue（2026-11-17）"
            exit 1
          fi
          # runners 列表 API 需要管理员级 token（GITHUB_TOKEN 即使 actions:read 也 403）
          COUNT=$(gh api "repos/${{ github.repository }}/actions/runners" \
            --jq '[.runners[] | select(.status == "online") | select(any(.labels[]; .name == "gpu"))] | length')
          echo "online gpu-labelled runners: ${COUNT}"
          if [ "${COUNT}" -gt 0 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::没有在线的 self-hosted gpu runner；冒烟未执行。本仓库已停用自动触发与 skip-record issue（2026-11-17）"
            exit 1
          fi

  gpu-smoke:
    needs: runner-precheck
    if: needs.runner-precheck.outputs.available == 'true'
    runs-on: [self-hosted, gpu]
    timeout-minutes: 300
    steps:
      - name: Fetch workflow scripts via codeload source archive
        shell: pwsh
        # 评估报告 R4 跟进：上下文经 env 注入（run-shell-injection 消解）
        env:
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # 本 runner 网络下 git smart-HTTP 长连接不稳（checkout@v4 实测 20+ 分钟零推进），
          # codeload 源码包通道实测 1s 内返回；只取三个脚本文件，整包也仅数 MB。
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $ref = $env:REF_NAME
          Invoke-WebRequest "https://codeload.github.com/$env:REPO/tar.gz/refs/heads/$ref" -OutFile src.tgz -UseBasicParsing
          New-Item -ItemType Directory -Path src -Force | Out-Null
          # Windows 自带 tar（bsdtar）对归档中的中文文件名会报
          # "Invalid empty pathname"（编码缺陷），改用 Python tarfile（UTF-8 安全）解压。
          @'
          import tarfile
          prefix = "SeedVR2-Turbo-main/"
          t = tarfile.open("src.tgz", "r:gz")
          n = 0
          for m in t.getmembers():
              if m.name.endswith("/") or not m.name.startswith(prefix):
                  continue
              rel = m.name[len(prefix):]
              if not rel:
                  continue
              m.name = rel
              try:
                  t.extract(m, "src", filter="data")
              except TypeError:
                  t.extract(m, "src")
              n += 1
          print("extracted:", n)
          '@ | python -
          New-Item -ItemType Directory -Path scripts -Force | Out-Null
          Copy-Item src\scripts\unpack_portable_bundle.ps1, src\scripts\portable_bundle_lib.ps1, src\scripts\smoke_portable_bundle.py scripts\
          Remove-Item src.tgz -Force
          Write-Host "src/ 保留：image_metrics.py 作为质量门对历史便携包的模块回退"
          Get-ChildItem scripts | Select-Object Name, Length

      - name: Resolve target release tag
        id: tag
        shell: pwsh
        # 评估报告 R4 跟进：event.inputs 经 env 注入（run-shell-injection 消解）
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          # 优先级：手动输入 > 最新已发布 Release。
          $t = $env:INPUT_TAG
          if (-not $t) {
            $t = gh release list --limit 20 --json tagName,isDraft,isPrerelease |
              ConvertFrom-Json |
              Where-Object { -not $_.isDraft -and -not $_.isPrerelease } |
              Select-Object -First 1 -ExpandProperty tagName
          }
          if (-not $t) { throw "no published release found" }
          Write-Host "smoking release: $t"
          "tag=$t" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append

      - name: Download release assets (resumable, stall-aware, official-first with mirror fallback)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 本机到 GitHub CDN 的带宽按数十分钟尺度剧烈波动（实测 5MB/s ↔ 4KB/s 互切，
          # 单连接还可能 TCP 挂死）。对策：curl --speed-limit 61440 --speed-time 60 令
          # 停滞连接 60s 内主动断开（exit 28），外层按文件做多轮 resume 循环
          # （-C - 续传），在 150+ 分钟窗口内自动骑上网络恢复的波段；
          # 官方通道与公共镜像逐轮交替。无论来源，解包步骤按 manifest/SHA256SUMS
          # 逐卷强制 SHA256，损坏与篡改必被发现。
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path bundle -Force | Out-Null
          $tag = "${{ steps.tag.outputs.tag }}"
          $assets = @(gh release view $tag --json assets -q '.assets[].name')
          $direct = "https://github.com/${{ github.repository }}/releases/download/$tag"
          $mirror = "https://gh-proxy.com/https://github.com/${{ github.repository }}/releases/download/$tag"
          $curlBase = @('-sSL', '--ssl-no-revoke', '-C', '-', '--speed-limit', '61440', '--speed-time', '60')
          foreach ($name in $assets) {
            $out = Join-Path bundle $name
            $done = $false
            for ($round = 1; $round -le 8 -and -not $done; $round++) {
              $base = if ($round % 2) { $direct } else { $mirror }
              Write-Host "GET $name round $round via $($base.Split('/')[2])"
              curl.exe @curlBase -o $out "$base/$name"
              # 0=完整 33=range 416(已完整) → 成功；28=停滞/超时 → 下一轮续传
              if ($LASTEXITCODE -eq 0 -or $LASTEXITCODE -eq 33) { $done = $true }
              elseif ($LASTEXITCODE -eq 28) { Write-Host "  stalled, resuming next round ($([int]((Get-Item $out -ErrorAction SilentlyContinue).Length/1MB)) MB so far)"; Start-Sleep -Seconds 15 }
              else { Write-Host "  curl exit $LASTEXITCODE, next round"; Start-Sleep -Seconds 20 }
            }
            if (-not $done) { throw "failed to download asset after 8 rounds: $name" }
            Write-Host ("  ok  {0}  {1:N1} MB" -f $name, ((Get-Item $out).Length / 1MB))
          }
          Get-ChildItem bundle |
            Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} |
            Format-Table -AutoSize

      - name: Unpack (per-volume SHA256 -> merge -> extract -> offline torch install)
        shell: pwsh
        run: |
          # GitHub Windows runner 的 PATH 含 Git 的 usr\bin，GNU tar 会把 C:\ 当远程主机
          # （KNOWN_ISSUES #35）；历史 Release 资产内嵌的解包 lib 早于修复，故在步骤内
          # 前置 System32 让 bsdtar 优先（不动 job 级 env，避免覆盖 Actions 注入的 gh 路径）。
          $env:Path = 'C:\Windows\System32;C:\Windows;' + $env:Path
          $target = Join-Path $PWD 'target'
          & powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\unpack_portable_bundle.ps1 `
            -BundleDir "$PWD\bundle" -TargetDir $target
          if ($LASTEXITCODE -ne 0) { throw "unpack failed" }

      - name: Smoke with REAL inference + quality gate (--require-inference --quality-gate)
        shell: pwsh
        run: |
          python .\scripts\smoke_portable_bundle.py `
            --app-dir (Join-Path $PWD 'target\SeedVR2-Portable') `
            --require-inference --quality-gate --min-psnr 15 --min-ssim 0.5 `
            --metrics-module (Join-Path $PWD 'src\app\integrated_app\utils\image_metrics.py') `
            --boot-timeout 900 --task-timeout 1800 --resolution 512
          if ($LASTEXITCODE -ne 0) { throw "GPU smoke failed" }

      - name: Source-overlay smoke (main 源码跑在发布包运行时上 — 双层烟测源码层)
        shell: pwsh
        run: |
          # 上一遍证明「发布包原样」可真实推理；这一遍只替换代码与配置——把解包目录的
          # app/ 与 config.yaml 换成当前分支源码（src/ 已由 codeload 取出），复用同一
          # 便携 Python 环境、model/ 权重与运行时，重跑一次真机推理 + 质量门。
          # 价值：不重发版即暴露 main 相对最近发布包的 engines/ 与 optimization/gpu 回归
          # （两者都在 app/ 树下）；model_lib/、common/（禁区/稳定 vendored）刻意不覆盖，
          # 隔离「代码回归」与「vendored 漂移」。config.yaml 一并覆盖：若 main 配置需新键，
          # 属真实的发布集成缺口，红在此处正合适。
          $ErrorActionPreference = 'Stop'
          $portable = Join-Path $PWD 'target\SeedVR2-Portable'
          Remove-Item -Recurse -Force (Join-Path $portable 'app')
          Copy-Item -Recurse -Force (Join-Path $PWD 'src\app') (Join-Path $portable 'app')
          Copy-Item -Force (Join-Path $PWD 'src\config.yaml') (Join-Path $portable 'config.yaml')
          python .\scripts\smoke_portable_bundle.py `
            --app-dir $portable `
            --require-inference --quality-gate --min-psnr 15 --min-ssim 0.5 `
            --metrics-module (Join-Path $PWD 'src\app\integrated_app\utils\image_metrics.py') `
            --boot-timeout 900 --task-timeout 1800 --resolution 512
          if ($LASTEXITCODE -ne 0) { throw "source-overlay smoke failed: main 源码在发布包运行时上未通过真机验收" }

      - name: Quant baseline — prepare cross-precision weights (fp8; bundle ships mxfp8)
        # 量化质量基线：手动勾选 quant_baseline 时执行并归档（原 schedule 定期化已随
        # 2026-11-17 停用自动触发一并移除）。
        if: inputs.quant_baseline
        shell: pwsh
        run: |
          # 量化基线需要 ≥2 精度对比。便携包只内置 3B MXFP8（见 SOURCE.md），此处补下
          # numz 3B FP8 作参考精度（--precisions 已存在的会跳过；--no-vae 复用包内共享 VAE）。
          $ErrorActionPreference = 'Stop'
          $portable = Join-Path $PWD 'target\SeedVR2-Portable'
          $py = @(Resolve-Path (Join-Path $portable 'WPy64-*\python*\python.exe'), (Join-Path $portable 'WPy64-*\python\python.exe') -ErrorAction SilentlyContinue | ForEach-Object Path)
          if ($py.Count -eq 0) { throw "便携解释器未找到（quant 需 requests/huggingface_hub，非系统 python）" }
          & $py[0] (Join-Path $PWD 'src\scripts\download_model.py') --size 3b --precisions fp8 --no-vae --save-dir (Join-Path $portable 'model') --endpoint https://hf-mirror.com
          if ($LASTEXITCODE -ne 0) { throw "fp8 权重下载失败：量化基线缺参考精度" }

      - name: Quant baseline — serve-and-run cross-precision PSNR/SSIM
        if: inputs.quant_baseline
        shell: pwsh
        run: |
          # 常驻模式（smoke --serve-and-run）：由 smoke 起便携服务并复用其 boot/健康/关停链路，
          # 就绪后驱动 perf/benchmark/quant_quality_baseline.py 对 fp8 与 mxfp8 跑同一确定性
          # golden 源图，产出 PSNR/SSIM 对比 JSON（MLOps P2-6）。cwd 为便携目录，故全用绝对路径。
          $ErrorActionPreference = 'Stop'
          $portable = Join-Path $PWD 'target\SeedVR2-Portable'
          $out = Join-Path $PWD 'quant_baseline.json'
          $serve = @((Join-Path $PWD 'src\perf\benchmark\quant_quality_baseline.py'),
            '--base-url', 'http://127.0.0.1:7870',
            '--model', '3b', '--precisions', 'fp8', 'mxfp8', '--reference', 'fp8',
            '--resolution', '512', '--seed', '42', '--timeout', '2400',
            '--src-dir', (Join-Path $PWD 'src'),
            '--output', $out)
          python (Join-Path $PWD 'src\scripts\smoke_portable_bundle.py') --app-dir $portable --boot-timeout 900 --serve-and-run '{python}' @serve
          if ($LASTEXITCODE -ne 0) { throw "量化质量基线未通过：fp8↔mxfp8 精度间质量回退或服务异常" }
          if (-not (Test-Path $out)) { throw "quant_baseline.json 未生成" }
          Write-Host '--- quant_baseline.json ---'
          Get-Content $out -Raw

      - name: Upload quant baseline JSON
        if: inputs.quant_baseline && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quant-baseline
          path: quant_baseline.json
          if-no-files-found: warn
