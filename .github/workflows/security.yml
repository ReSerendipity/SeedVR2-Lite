name: Security Scan (SAST)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'  # 每周一凌晨 4 点

permissions:
  contents: read
  security-events: write

# 同 PR 的新推送会取代旧运行的结论：取消旧运行，只留最新一次。
# push（含 main 上的正式验证）不取消——那条是权威记录，不能被后来的推送半路掐掉。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Semgrep Scan (block on ERROR)"
        # 硬门禁（后续建议 R4 落地）：ERROR findings 现为零——存量 10 条经
        # 分诊修复（4 处 Actions run-shell-injection 改 env 注入真修复；torch.load/
        # save 与 sqlalchemy/Popen2 的 6 处 nosemgrep 标注升级为完整规则 ID +
        # 移到匹配首行，本地 semgrep 1.173.0 全仓扫描实证 ERROR=0）。
        # 自此新引入的 ERROR 级 finding 会阻断 CI。WARNING/MEDIUM 仍经下方
        # 全量 SARIF 上报人工分诊，不阻断。
        run: |
          python -m pip install semgrep==1.173.0
          semgrep scan --config auto --severity ERROR --error

      - name: Semgrep SARIF (all severities)
        # 全量告警（含 WARNING/MEDIUM）进 SARIF 上报，不参与门禁。
        # nosemgrep 修正（2026-09-06 实证）：semgrep 1.173.0 的 --sarif 输出
        # 不应用 nosemgrep 抑制且 result 缺 level，GitHub 按规则
        # defaultConfiguration.level=error 建告警 → 被抑制项在面板永不自愈。
        # 用 --json 扫描（正确应用抑制）作事实源过滤 SARIF，见
        # scripts/ci/sarif_nosemgrep_filter.py。|| true 仅作用于 semgrep 自身
        # 容错：工具故障由上方 gate 步骤暴露，不在此静默。
        if: always()
        run: |
          semgrep scan --config auto --sarif --output semgrep.sarif || true
          semgrep scan --config auto --json --output semgrep.findings.json || true
          python scripts/ci/sarif_nosemgrep_filter.py semgrep.sarif semgrep.findings.json semgrep.sarif

      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          sarif_file: semgrep.sarif

  # 密钥泄露扫描 — 学习 Image_MultiModel 的 Trivy FS 模式
  # 扫描仓库历史中的密钥/Token 泄露，防止凭据意外提交。
  secret-scan:
    name: Secret Scanning (Trivy FS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Trivy secret scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0 (2026-04-22 官方攻击响应后最新稳定版; SHA pin 防 tag 强更)
        with:
          scan-type: 'fs'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          scanners: 'secret'
          scan-ref: '.'
