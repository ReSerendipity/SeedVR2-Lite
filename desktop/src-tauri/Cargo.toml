[package]
name = "seedvr2-desktop"
version = "1.0.2"
description = "SeedVR2 桌面应用壳"
authors = ["SeedVR2"]
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "native-tls", "stream"], default-features = false }
winreg = "0.52"
futures = "0.3"
log = "0.4"
env_logger = "0.11"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
semver = "1"
sha2 = "0.10"
base64 = "0.22"
# zip 依赖已移除（2026-11-24）：增量更新路线删除后 Rust 源码零使用，
# 且 zip 2.4.2 命中 CVE-2026-115905（critical）等 3 条告警；需用时直接升 9.x。
open = "5"

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
