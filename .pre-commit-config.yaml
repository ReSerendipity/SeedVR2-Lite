repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        args: [--fix]
    # 格式化交给下面的 black（CI 与 precheck 同样跑 black --check）。
    # 不要在此再加 ruff-format：它与 black 的折行规则存在分歧，两个 formatter
    # 同时强制会让「提交时被 ruff 改写、push 时被 black 拒绝」来回翻转
    # （实测见 KNOWN_ISSUES #61）。

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black
        args: [--config, pyproject.toml]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements
      - id: detect-private-key

  # mypy 必须在项目环境里跑（pydantic 插件与第三方 stub 缺依赖会误报，isolated env 不可用），
  # 但"环境在哪台机器上、放在哪个路径"是宿主的事。写死 .venv/Scripts/python.exe 的后果：
  # linked worktree 没有自己的 .venv、POSIX 主机没有 Scripts/ 这一层，两者都吃
  # "Executable `.venv/Scripts/python.exe` not found" —— 提交被拦下，类型检查却一行没跑。
  # 解释器改由 scripts/mypy_gate.py 按 .githooks/pre-commit 的四级回退探测
  # （.venv/Scripts/python.exe → .venv/bin/python → python → python3）。
  # 残留口径：入口 token 仍是 `python`，只装了 `python3` 的主机会在 which 阶段就找不到——
  # 这条 by design 留给"本机根本没有 python"的语义，此时报错是真诊断。
  # 仅 app/integrated_app 下有 .py 改动时触发，口径与 ci.yml 一致（run_checks.bat 为维护者本地脚本，未随仓库分发）。
  - repo: local
    hooks:
      - id: mypy
        name: mypy app/integrated_app
        entry: python scripts/mypy_gate.py mypy app/integrated_app
        language: system
        pass_filenames: false
        files: ^app/integrated_app/.*\.py$

  # 编辑后验证（commit 层）：ruff 只查本次改到的 .py + 定向 pytest；一个定向用例都对不上时
  # 退回全量 + 覆盖率门槛。本钩子存在的理由就是把「改完就地验一次」钉在最早的门禁点上，
  # 而不是让它在 push / CI 才第一次被执行（失败原因已经隔了几百行改动）。
  # `verbose: true` 是刻意的：验证输出必须留在终端（进而留在会话上下文）当证据，
  # 静默通过等于没留痕；口径与退出码含义见 scripts/post_edit_gate.py。
  # 注：push 层的全量 + --cov-fail-under=55 在 .githooks/pre-push 一侧跑（见该文件），
  # 不在此钩子内叠加，否则每次提交都要为重推一次付完整测试时间。本钩子只在 pre-commit 阶段生效，
  # 避免 `pre-commit run --hook-stage pre-push` 把十秒层误当成全量层。
  - repo: local
    hooks:
      - id: post-edit-validation
        name: Post-edit validation (ruff changed files + targeted pytest)
        entry: python scripts/post_edit_gate.py
        language: system
        files: \.py$
        require_serial: true
        verbose: true
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: structure-guard
        name: Structure Guard (root layout)
        entry: python .github/scripts/check_layout.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-system
        pass_filenames: false
